<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Home Dashboard UI</title>
  <!-- Google Fonts & Phosphor Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Chart.js สำหรับกราฟ Electricity Usage -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      /* พื้นหลังโทนชมพู ม่วง นวลแบบภาพต้นฉบับ */
      background: radial-gradient(circle at 10% 20%, #fbc2eb 0%, #a18cd1 40%, #e0c3fc 70%, #fad0c4 100%);
      background-attachment: fixed;
      overflow-x: auto;
    }

    /* ตกแต่ง Blob ด้านหลัง */
    .bg-blobs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.6;
    }
    .blob-1 { width: 350px; height: 350px; background: #ff9a9e; top: -50px; left: 10%; }
    .blob-2 { width: 400px; height: 400px; background: #a18cd1; bottom: -50px; right: 15%; }

    /* คอนเทนเนอร์แสดงการ์ดทั้ง 3 หน้า */
    .dashboard-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* โครงสร้างตัวเครื่อง / Phone Frame */
    .device-screen {
      width: 330px;
      height: 680px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 42px;
      box-shadow: 0 25px 45px rgba(162, 126, 202, 0.25);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 28px 22px 20px 22px;
      color: #4a4768;
      overflow: hidden;
    }

    /* ปุ่มด้านบน Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #635b7e;
      font-size: 18px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.8);
      transition: all 0.2s;
    }
    .icon-btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
    }
    .top-title {
      font-size: 16px;
      font-weight: 700;
      color: #3f395b;
    }

    /* Screen 1: Home Overview */
    .greeting-subtitle {
      font-size: 15px;
      font-weight: 600;
      color: #5d557c;
      margin-bottom: 4px;
    }
    .main-clock {
      font-size: 38px;
      font-weight: 300;
      letter-spacing: -0.5px;
      color: #4b456b;
      margin-bottom: 24px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #443e62;
    }
    .view-all {
      font-size: 11px;
      color: #8c85a8;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* ตารางห้อง Rooms Grid */
    .room-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .room-card {
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 120px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .room-card.active {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 20px rgba(175, 145, 215, 0.2);
      border-color: #ffffff;
    }
    .room-card:hover {
      transform: translateY(-3px);
    }
    .room-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .room-card.active .room-icon-box {
      background: #48416d;
      color: #ffffff;
    }
    .room-card:not(.active) .room-icon-box {
      background: rgba(255, 255, 255, 0.6);
      color: #5c5579;
    }
    .room-name {
      font-size: 13px;
      font-weight: 600;
      color: #3b3558;
      margin-bottom: 2px;
    }
    .device-count {
      font-size: 10px;
      color: #928ca9;
    }

    /* Screen 2: Thermostat Dial */
    .dial-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 10px auto 25px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circular-progress {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: conic-gradient(#b68bf1 0% 68%, rgba(255, 255, 255, 0.4) 68% 100%);
      box-shadow: 0 10px 25px rgba(182, 139, 241, 0.2);
    }
    .dial-inner {
      width: 84%;
      height: 84%;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
    }
    .dial-ticks {
      position: absolute;
      width: 88%;
      height: 88%;
      border-radius: 50%;
      border: 2px dashed rgba(182, 139, 241, 0.3);
    }
    .dial-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #ffffff;
      border: 3px solid #b68bf1;
      border-radius: 50%;
      top: 14px;
      right: 38px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    .temp-value {
      font-size: 38px;
      font-weight: 700;
      color: #3b365b;
      line-height: 1;
      position: relative;
    }
    .temp-unit {
      font-size: 16px;
      font-weight: 500;
      position: absolute;
      top: 0;
      right: -16px;
    }
    .temp-label {
      font-size: 10px;
      color: #9f9ab4;
      margin-top: 4px;
    }

    .metrics-row {
      display: flex;
      justify-content: space-around;
      margin-bottom: 22px;
    }
    .metric-item {
      text-align: center;
    }
    .metric-label {
      font-size: 10px;
      color: #8f88a8;
      margin-bottom: 4px;
    }
    .metric-val {
      font-size: 16px;
      font-weight: 700;
      color: #3c375b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .metric-val i {
      font-size: 11px;
    }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .preset-card {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 14px;
      padding: 10px 6px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: 0.2s;
    }
    .preset-card:hover {
      background: rgba(255, 255, 255, 0.8);
    }
    .preset-title {
      font-size: 9px;
      color: #8c86a3;
      margin-bottom: 2px;
    }
    .preset-temp {
      font-size: 14px;
      font-weight: 700;
      color: #393457;
    }

    /* Screen 3: Balance & Usage */
    .balance-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.6);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 10px;
      color: #5e577d;
      margin: 0 auto 8px auto;
      cursor: pointer;
    }
    .balance-amount {
      text-align: center;
      font-size: 32px;
      font-weight: 600;
      color: #3e375d;
      margin-bottom: 18px;
      letter-spacing: -0.5px;
    }
    .chart-container {
      position: relative;
      height: 180px;
      width: 100%;
      margin-bottom: 20px;
    }

    .capacity-row {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.3);
      padding: 12px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .circle-stat {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: conic-gradient(#b68bf1 0% 76%, rgba(255, 255, 255, 0.6) 76% 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #3d375d;
    }
    .circle-stat-inner {
      width: 34px;
      height: 34px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .capacity-info .cap-label {
      font-size: 10px;
      color: #918aa8;
    }
    .capacity-info .cap-val {
      font-size: 15px;
      font-weight: 700;
      color: #373255;
    }

    /* แถบเมนูด้านล่าง Bottom Navigation */
    .bottom-nav {
      position: absolute;
      bottom: 12px;
      left: 18px;
      right: 18px;
      height: 60px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(15px);
      border-radius: 26px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 8px 20px rgba(180, 150, 220, 0.15);
    }
    .nav-btn {
      color: #8e88aa;
      font-size: 18px;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-btn.active, .nav-btn:hover {
      color: #4b446e;
    }
    .mic-btn-container {
      position: relative;
      top: -14px;
    }
    .mic-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a788e0, #8867c4);
      border: 3px solid rgba(255, 255, 255, 0.9);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 8px 16px rgba(144, 107, 203, 0.35);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .mic-btn:hover {
      transform: scale(1.06);
    }
  </style>
</head>
<body>

  <!-- Background Glowing Elements -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="dashboard-wrapper">

    <!-- Screen 1: Home Dashboard -->
    <div class="device-screen">
      <div class="top-bar">
        <div class="icon-btn"><i class="ph-bold ph-squares-four"></i></div>
        <div class="icon-btn" style="border-radius: 50%;"><i class="ph ph-user"></i></div>
      </div>

      <div class="greeting-subtitle">Good Morning!</div>
      <div class="main-clock" id="current-clock">08:24</div>

      <div class="section-header">
        <span class="section-title">Room</span>
        <span class="view-all">View All <i class="ph-bold ph-caret-down"></i></span>
      </div>

      <div class="room-grid">
        <div class="room-card active">
          <div class="room-icon-box"><i class="ph-fill ph-armchair"></i></div>
          <div>
            <div class="room-name">Living room</div>
            <div class="device-count">3 Devices</div>
          </div>
        </div>

        <div class="room-card">
          <div class="room-icon-box"><i class="ph-bold ph-bed"></i></div>
          <div>
            <div class="room-name">Bedroom</div>
            <div class="device-count">3 Devices</div>
          </div>
        </div>

        <div class="room-card">
          <div class="room-icon-box"><i class="ph-bold ph-fork-knife"></i></div>
          <div>
            <div class="room-name">Dining room</div>
            <div class="device-count">5 Devices</div>
          </div>
        </div>

        <div class="room-card">
          <div class="room-icon-box"><i class="ph-bold ph-refrigerator"></i></div>
          <div>
            <div class="room-name">Kitchen</div>
            <div class="device-count">3 Devices</div>
          </div>
        </div>
      </div>

      <!-- Bottom Nav -->
      <div class="bottom-nav">
        <button class="nav-btn active"><i class="ph-fill ph-house"></i></button>
        <button class="nav-btn"><i class="ph ph-calendar-blank"></i></button>
        <div class="mic-btn-container">
          <div class="mic-btn"><i class="ph-bold ph-microphone"></i></div>
        </div>
        <button class="nav-btn"><i class="ph ph-heart"></i></button>
        <button class="nav-btn"><i class="ph ph-user"></i></button>
      </div>
    </div>


    <!-- Screen 2: Living Room Thermostat -->
    <div class="device-screen">
      <div class="top-bar">
        <div class="icon-btn"><i class="ph-bold ph-arrow-left"></i></div>
        <div class="top-title">Living Room</div>
        <div class="icon-btn"><i class="ph-bold ph-nut"></i></div>
      </div>

      <!-- Thermostat Dial -->
      <div class="dial-container">
        <div class="circular-progress">
          <div class="dial-handle"></div>
          <div class="dial-inner">
            <div class="dial-ticks"></div>
            <div class="temp-value">24<span class="temp-unit">°c</span></div>
            <div class="temp-label">Temperature</div>
          </div>
        </div>
      </div>

      <div class="metrics-row">
        <div class="metric-item">
          <div class="metric-label">Current temp</div>
          <div class="metric-val"><i class="ph-bold ph-caret-up" style="color: #6c5ce7;"></i> 24°c</div>
        </div>
        <div class="metric-item">
          <div class="metric-label">Current humidity</div>
          <div class="metric-val"><i class="ph-bold ph-caret-down" style="color: #6c5ce7;"></i> 64%</div>
        </div>
      </div>

      <div class="preset-row">
        <div class="preset-card">
          <div class="preset-title">Heating</div>
          <div class="preset-temp">24°c</div>
        </div>
        <div class="preset-card">
          <div class="preset-title">Cooling</div>
          <div class="preset-temp">15°c</div>
        </div>
        <div class="preset-card">
          <div class="preset-title">Airwave</div>
          <div class="preset-temp">26°c</div>
        </div>
      </div>

      <!-- Bottom Nav -->
      <div class="bottom-nav">
        <button class="nav-btn"><i class="ph ph-house"></i></button>
        <button class="nav-btn"><i class="ph ph-calendar-blank"></i></button>
        <div class="mic-btn-container">
          <div class="mic-btn"><i class="ph-bold ph-microphone"></i></div>
        </div>
        <button class="nav-btn"><i class="ph ph-heart"></i></button>
        <button class="nav-btn"><i class="ph ph-user"></i></button>
      </div>
    </div>


    <!-- Screen 3: Daily Balance & Electricity Usage -->
    <div class="device-screen">
      <div class="top-bar">
        <div class="icon-btn"><i class="ph-bold ph-arrow-left"></i></div>
        <div class="top-title">Daily Balance</div>
        <div class="icon-btn"><i class="ph-bold ph-nut"></i></div>
      </div>

      <div style="text-align: center;">
        <div class="balance-badge">Today <i class="ph-bold ph-caret-down"></i></div>
        <div class="balance-amount">43.058</div>
      </div>

      <div class="section-title" style="margin-bottom: 8px;">Electricity Usage</div>
      
      <!-- กราฟ Chart.js -->
      <div class="chart-container">
        <canvas id="usageChart"></canvas>
      </div>

      <div class="capacity-row">
        <div class="circle-stat">
          <div class="circle-stat-inner">76%</div>
        </div>
        <div class="capacity-info">
          <div class="cap-label">Capacity</div>
          <div class="cap-val">7,876 kW</div>
        </div>
      </div>

      <!-- Bottom Nav -->
      <div class="bottom-nav">
        <button class="nav-btn"><i class="ph ph-house"></i></button>
        <button class="nav-btn"><i class="ph ph-calendar-blank"></i></button>
        <div class="mic-btn-container">
          <div class="mic-btn"><i class="ph-bold ph-microphone"></i></div>
        </div>
        <button class="nav-btn"><i class="ph ph-heart"></i></button>
        <button class="nav-btn"><i class="ph ph-user"></i></button>
      </div>
    </div>

  </div>

  <script>
    // อัปเดตเวลานาฬิกาแบบเรียลไทม์
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const clockElement = document.getElementById('current-clock');
      if (clockElement) {
        clockElement.textContent = `${hours}:${minutes}`;
      }
    }
    updateClock();
    setInterval(updateClock, 1000);

    // เรนเดอร์กราฟ Electricity Usage เลียนแบบสไตล์ในภาพ
    const ctx = document.getElementById('usageChart').getContext('2d');
    
    // ทำ Gradient สีม่วงพาสเทลใต้เส้นกราฟ
    const gradient = ctx.createLinearGradient(0, 0, 0, 160);
    gradient.addColorStop(0, 'rgba(182, 139, 241, 0.45)');
    gradient.addColorStop(1, 'rgba(182, 139, 241, 0.0)');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['09:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00'],
        datasets: [{
          data: [25, 45, 38, 48, 85, 40, 52],
          borderColor: '#9867db',
          borderWidth: 2.5,
          tension: 0.45,
          fill: true,
          backgroundColor: gradient,
          pointRadius: [0, 0, 0, 0, 6, 0, 0],
          pointBackgroundColor: '#ffffff',
          pointBorderColor: '#9867db',
          pointBorderWidth: 2.5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { enabled: true }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: {
              color: '#9c95b3',
              font: { size: 9 }
            }
          },
          y: {
            display: false,
            min: 0,
            max: 100
          }
        }
      }
    });
  </script>
</body>
</html>
